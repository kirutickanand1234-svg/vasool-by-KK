function report(){var R=S.rep,fr=R.from,to=R.to,ci=R.city,res={cols:[],rows:[]},cs=db.cust.filter(function(c){return!ci||c.cityId===ci}),pay=db.tx.filter(function(t){return t.t==="c"&&t.d>=fr&&t.d<=to&&(!ci||t.cityId===ci)}),ex=db.tx.filter(function(t){return t.t!=="c"&&t.d>=fr&&t.d<=to&&(!ci||t.cityId===ci)});
 var grp=function(keyf){var g={};pay.forEach(function(t){var k=keyf(t);g[k]=g[k]||{a:0,cash:0,on:0,n:{}};g[k].a+=t.a;g[k][t.m==="online"?"on":"cash"]+=t.a;g[k].n[t.cid]=1});return Object.keys(g).sort().map(function(k){var x=g[k];return[k,F(x.a),F(x.cash),F(x.on),Object.keys(x.n).length]})};
 var intr=function(t){var c=cust(t.cid);return c?t.a*(tot(c)-c.amt)/tot(c):0};
 switch(R.t){
 case"daily":res.cols=["Date","Collection","Cash","Online","Customers"];res.rows=grp(function(t){return t.d});break;
 case"weekly":res.cols=["Week starting","Collection","Cash","Online","Customers"];res.rows=grp(function(t){return add(t.d,-((dow(t.d)+6)%7))});break;
 case"monthly":res.cols=["Month","Collection","Cash","Online","Customers"];res.rows=grp(function(t){return t.d.slice(0,7)});break;
 case"city":res.cols=["City","Loans given","Collection","P Bal","Interest income","Expenses"];res.rows=db.cities.filter(function(c){return!ci||c.id===ci}).map(function(c){var f={city:c.id,date:to};return[c.name,F(db.cust.filter(function(x){return x.cityId===c.id&&x.loanDate>=fr&&x.loanDate<=to}).reduce(function(s,x){return s+x.amt},0)),F(pay.filter(function(t){return t.cityId===c.id}).reduce(function(s,t){return s+t.a},0)),F(dayT(f).pbal),F(r2(pay.filter(function(t){return t.cityId===c.id}).reduce(function(s,t){return s+intr(t)},0))),F(ex.filter(function(t){return t.cityId===c.id}).reduce(function(s,t){return s+t.a},0))]});break;
 case"area":res.cols=["City","Area","Day","Collection","P Bal"];res.rows=db.areas.filter(function(a){return!ci||a.cityId===ci}).map(function(a){return[cn(a.cityId),a.name,a.day!=null?DAYS[a.day]:"—",F(pay.filter(function(t){return t.areaId===a.id}).reduce(function(s,t){return s+t.a},0)),F(dayT({city:a.cityId,area:a.id,date:to}).pbal)]});break;
 case"cust":res.cols=["ID","Customer","City","Area","Loan","Payable","Paid","Balance","Status"];res.rows=cs.map(function(c){var m=cm(c,to);return[c.code,c.name,cn(c.cityId),an(c.areaId),F(c.amt),F(m.tot),F(m.paid),F(m.bal),c.status]});break;
 case"out":res.cols=["ID","Customer","City","Area","Balance","P Bal","Pending inst."];res.rows=cs.filter(function(c){return c.status!=="completed"&&cm(c,to).bal>0}).map(function(c){var m=cm(c,to);return[c.code,c.name,cn(c.cityId),an(c.areaId),F(m.bal),F(m.prin),m.pend]});break;
 case"int":res.cols=["Date","Interest income"];var g={};pay.forEach(function(t){g[t.d]=(g[t.d]||0)+intr(t)});res.rows=Object.keys(g).sort().map(function(k){return[k,F(r2(g[k]))]});res.rows.push(["Total",F(r2(Object.keys(g).reduce(function(s,k){return s+g[k]},0)))]);break;
 case"exp":res.cols=["Date","Type","Name","City","Amount"];res.rows=ex.sort(function(a,b){return a.d.localeCompare(b.d)}).map(function(t){return[t.d,t.t==="b"?"Bill":"Expense",t.name,cn(t.cityId),F(t.a)]});break;
 case"pl":var I=r2(pay.reduce(function(s,t){return s+intr(t)},0)),E=r2(ex.filter(function(t){return t.t==="e"}).reduce(function(s,t){return s+t.a},0)),B=r2(ex.filter(function(t){return t.t==="b"}).reduce(function(s,t){return s+t.a},0));
  res.cols=["Item","Amount"];res.rows=[["Interest income",F(I)],["Expenses",F(E)],["Bills",F(B)],["Profit / (Loss)",F(r2(I-E-B))]]}
 return res}
