<script>
(function(){"use strict";
/*LOGIC*/
var K="vasool_v2",OLD="vasool_collection_customers_v1",OLDT="vasool_tx_v1",OLDG="vasool_geo_v1",OLDC="vasool_cfg_v1";
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var r2=function(x){return Math.round((x+Number.EPSILON)*100)/100};

var add=function(d,n){var x=pd(d);x.setDate(x.getDate()+n);return iso(x)};
var today=function(){return iso(new Date())};
var dow=function(d){return pd(d).getDay()};
var nextDay=function(day,from){for(var i=0;i<7;i++){if(dow(add(from,i))===day)return add(from,i)}};
var uid=function(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3)};
var db={cities:[],areas:[],cust:[],tx:[],audit:[],np:{},cfg:{pin:"",bio:"",lockMins:2,theme:"dark",swipeMode:"cash",dueMode:"inst",confirmSwipe:true,missN:1}};
var city=function(id){return db.cities.find(function(x){return x.id===id})},area=function(id){return db.areas.find(function(x){return x.id===id})},cust=function(id){return db.cust.find(function(x){return x.id===id})};
function audit(a,d){db.audit.unshift({id:uid(),ts:new Date().toISOString(),a:a,d:d});db.audit=db.audit.slice(0,500)}
function rateFor(cid,aid){var a=area(aid),c=city(cid);return a&&a.rate!=null?a.rate:(c?c.rate:0)}
function inhDay(cid,aid){var a=area(aid),c=city(cid);if(a&&a.day!=null)return a.day;if(c&&c.day!=null)return c.day;return null}
function effDay(c){var d=inhDay(c.cityId,c.areaId);return d!=null?d:c.day}
function tot(c){return r2(c.amt*(1+c.rate/100))}
function paidTo(c,d){return r2(db.tx.reduce(function(s,t){return s+(t.t==="c"&&t.cid===c.id&&t.d<=d?t.a:0)},0))}
function cm(c,d){var T=tot(c),p=paidTo(c,d),bal=r2(Math.max(0,T-p)),n=bal<=0?c.n:Math.min(c.n,c.inst?Math.floor((p+0.004)/c.inst):0);
 var wo=c.status==="completed"&&c.closedOn&&c.closedOn<=d;
 return{tot:T,paid:p,bal:bal,n:n,pend:c.n-n,prin:(wo||c.loanDate>d||!T)?0:r2(bal*c.amt/T)}}
function selOk(f,id,cid){var s=f.areas;if(!s||!s.length)return true;return id?s.indexOf(id)>-1:s.indexOf("c:"+cid)>-1}
function selCity(f,cid){var s=f.areas;if(!s||!s.length)return true;return s.some(function(x){return x.indexOf("c:")===0?x.slice(2)===cid:(area(x)||{}).cityId===cid})}
function cIn(f,c){return(!f.city||c.cityId===f.city)&&(!f.area||c.areaId===f.area)&&selOk(f,c.areaId,c.cityId)}
function tIn(f,t){return(!f.city||t.cityId===f.city)&&(!f.area||t.areaId===f.area)&&(t.areaId?selOk(f,t.areaId,t.cityId):selCity(f,t.cityId))}
function lineMap(){var m={};function put(d,k,n,c){if(d==null)return;m[d]=m[d]||{};m[d][k]={id:k,name:n,city:c}}
 var cname=function(id){return(city(id)||{}).name||""};
